<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Calatrava</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icono-calatrava.png">
  <link rel="apple-touch-icon" href="assets/icono-app.png">
</head>
<body class="auth">
  <div class="registro">
    <aside class="auth-brand imagen">
      <div class="auth-brand-copy auth-copy">
        <div class="auth-mark"><img src="assets/logo-calatrava.png" alt="Calatrava Parqueadero"></div>
        <h2>Alta de usuario</h2>
        <p>Registre sus datos para reservar cupos y consultar el estado de sus vehículos.</p>
      </div>
    </aside>
    <div class="campos">
      <form id="registroForm" class="campos_sec">
        <h1 class="titu">Registrar</h1>
        <p class="auth-lead">Complete la información requerida para habilitar el acceso.</p>
        <div class="formulario">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" maxlength="50" minlength="3" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" placeholder="Nombre">
        </div>
        <div class="formulario">
          <label for="correo">Correo</label>
          <input type="email" id="correo" maxlength="100" placeholder="correo@ejemplo.com">
        </div>
        <div class="formulario">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" minlength="8" maxlength="30" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="formulario">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="Solo números">
        </div>
        <div class="formulario">
          <label for="placa">Placa</label>
          <input type="text" maxlength="6" id="placa" placeholder="ABC123" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
        </div>
        <button type="submit" class="reserrr">Registrar</button>
        <div class="auth-links">
          <p>¿Ya tiene cuenta? <a href="login.html">Iniciar sesión</a></p>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="./backend/Registro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><img class="pantalla_carga_icono" src="assets/icono-calatrava.png" alt=""></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Calatrava Parqueadero</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
