<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Parqueadero CJ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
  <div class="registro">
    <aside class="auth-brand imagen">
      <div class="auth-brand-copy auth-copy">
        <div class="auth-mark"><span>P</span> Parqueadero CJ</div>
        <h2>Acceso al sistema de control</h2>
        <p>Gestión de reservas, cupos y operación diaria del parqueadero en un solo panel.</p>
      </div>
    </aside>
    <div class="campos">
      <div class="campos_sec">
        <h1 class="titu">Iniciar sesión</h1>
        <p class="auth-lead">Ingrese con su correo institucional o de usuario registrado.</p>
        <form id="LoginForm">
          <div class="formulario">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="formulario">
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" placeholder="••••••••" required>
          </div>
          <button type="submit" class="reserrr">Entrar al sistema</button>
        </form>
        <div class="auth-links">
          <p><a href="recuperar.html">Recuperar contraseña</a></p>
          <p>¿No tiene cuenta? <a href="index.html">Crear registro</a></p>
        </div>
      </div>
    </div>
  </div>
  <!-- Requerido por login.js (mismo módulo en login y recuperar) -->
  <form id="recuperar" class="form-hidden" aria-hidden="true">
    <input type="email" name="correo">
  </form>
  <script type="module" src="./backend/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><span class="pantalla_carga_p">CJ</span></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Parqueadero CJ</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
