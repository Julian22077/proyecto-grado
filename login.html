<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Calatrava</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icono-calatrava.png">
  <link rel="apple-touch-icon" href="assets/icono-app.png">
</head>
<body class="auth">
  <div class="registro">
    <aside class="auth-brand imagen">
      <div class="auth-brand-copy auth-copy">
        <div class="auth-mark"><img src="assets/logo-calatrava.png" alt="Calatrava Parqueadero"></div>
        <h2>Iniciar Sesión</h2>
        <p>Gestión de reservas, cupos y operación diaria del parqueadero en un solo panel.</p>
      </div>
    </aside>
    <div class="campos">
      <div class="campos_sec">
        <h1 class="titu">Iniciar sesión</h1>
        <p class="auth-lead">Ingrese con su correo y contraseña correspondientes.</p>
        <form id="LoginForm">
          <div class="formulario">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com">
          </div>
          <div class="formulario">
            <label for="contraseña">Contraseña</label>
            <div class="clave-vista">
              <input type="password" id="contraseña" name="contraseña" placeholder="••••••••">
              <button type="button" class="clave-ojo" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contraseña">
                <svg class="ojo-abierto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ojo-cerrado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.9 5.1A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a18.5 18.5 0 01-3.2 4.2"/><path d="M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 004.1-.8"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="reserrr">Entrar al sistema</button>
        </form>
        <div class="auth-links">
          <p><a href="recuperar.html">Recuperar contraseña</a></p>
          <p>¿No tiene cuenta? <a href="registro.html">Registrar</a></p>
        </div>
      </div>
    </div>
  </div>
  <!-- Requerido por login.js (mismo módulo en login y recuperar) -->
  <form id="recuperar" class="form-hidden" aria-hidden="true">
    <input type="email" name="correo">
  </form>
  <script type="module" src="./backend/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><img class="pantalla_carga_icono" src="assets/icono-calatrava.png" alt=""></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Calatrava Parqueadero</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
