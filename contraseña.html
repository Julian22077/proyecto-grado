<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — Calatrava</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icono-calatrava.png">
  <link rel="apple-touch-icon" href="assets/icono-app.png">
</head>
<body class="cuenta-page">
  <a href="perfil.html" class="volver" aria-label="Volver al perfil">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
      <path d="M9 12h12"/>
    </svg>
  </a>

  <main class="cuenta-edit">
    <form id="CambioContraseña" class="actualizar_datos cuenta-form-card">
      <header class="cuenta-form-head">
        <p class="cuenta-kicker">Seguridad</p>
        <h1 class="titu">Actualizar contraseña</h1>
        <p class="cuenta-form-lead">Usa entre 8 y 30 caracteres con mayúscula, minúscula, número y un carácter especial.</p>
      </header>

      <div class="cuenta-field">
        <label for="contraseñaActual">Contraseña actual</label>
        <div class="clave-vista">
          <input type="password" id="contraseñaActual" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="clave-ojo" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contraseñaActual">
            <svg class="ojo-abierto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojo-cerrado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.9 5.1A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a18.5 18.5 0 01-3.2 4.2"/><path d="M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 004.1-.8"/></svg>
          </button>
        </div>
      </div>
      <div class="cuenta-field">
        <label for="nuevaContraseña">Nueva contraseña</label>
        <div class="clave-vista">
          <input type="password" id="nuevaContraseña" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="clave-ojo" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="nuevaContraseña">
            <svg class="ojo-abierto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojo-cerrado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.9 5.1A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a18.5 18.5 0 01-3.2 4.2"/><path d="M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 004.1-.8"/></svg>
          </button>
        </div>
      </div>
      <div class="cuenta-field">
        <label for="confirmarContraseña">Confirmar nueva contraseña</label>
        <div class="clave-vista">
          <input type="password" id="confirmarContraseña" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="clave-ojo" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="confirmarContraseña">
            <svg class="ojo-abierto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojo-cerrado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.9 5.1A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a18.5 18.5 0 01-3.2 4.2"/><path d="M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 004.1-.8"/></svg>
          </button>
        </div>
      </div>

      <button type="submit">Cambiar contraseña</button>
      <a class="cuenta-back-link" href="perfil.html">Cancelar y volver</a>
    </form>
  </main>

  <script type="module" src="./backend/contraseña.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><img class="pantalla_carga_icono" src="assets/icono-calatrava.png" alt=""></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Calatrava Parqueadero</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
