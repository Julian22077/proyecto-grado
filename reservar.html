<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Reservar Parqueadero</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://checkout.wompi.co/widget.js"></script>
</head>

<body>
  <nav class="menu">
    <ul class="lista">
      <li class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" class="icono" width="30" height="30" fill="#10b4ff" viewBox="0 0 24 24">

            d="M6 8.44c-.02 5.1 5.17 9.18 5.39 9.35.18.14.4.21.61.21s.43-.07.61-.21c.22-.17 5.41-4.25 5.39-9.35C18 4.89 15.31 2 12 2S6 4.89 6 8.44m10 0c.01 3.19-2.74 6.08-4 7.24-1.26-1.15-4.01-4.04-4-7.24C8 5.99 9.79 4 12 4s4 1.99 4 4.44">
          </path>
          <path
            d="M12 6a2 2 0 1 0 0 4 2 2 0 1 0 0-4m6.02 8.73c-.4.64-.84 1.23-1.27 1.76C18.88 16.97 20 17.68 20 18c0 .51-2.75 2-8 2s-8-1.49-8-2c0-.32 1.12-1.03 3.25-1.51-.43-.53-.86-1.12-1.27-1.76C3.66 15.37 2 16.44 2 18c0 2.75 5.18 4 10 4s10-1.25 10-4c0-1.56-1.67-2.63-3.98-3.27">
          </path>
        </svg>
        <div class="oculto">Parqueadero CJ</div>
      </li>
      <li>
        <a href="usuario.html" class="elemento"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M3 13h1v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7h1c.4 0 .77-.24.92-.62.15-.37.07-.8-.22-1.09l-8.99-9a.996.996 0 0 0-1.41 0l-9.01 9c-.29.29-.37.72-.22 1.09s.52.62.92.62Zm9-8.59 6 6V20H6v-9.59z">
            </path>
          </svg>
          <div class="oculto">Inicio</div>
        </a>
      </li>
      <li>
        <a href="perfil.html" class="elemento"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 6c-2.28 0-4 1.72-4 4s1.72 4 4 4 4-1.72 4-4-1.72-4-4-4m0 6c-1.18 0-2-.82-2-2s.82-2 2-2 2 .82 2 2-.82 2-2 2">
            </path>
            <path
              d="M12 2C6.49 2 2 6.49 2 12c0 3.26 1.58 6.16 4 7.98V20h.03c1.67 1.25 3.73 2 5.97 2s4.31-.75 5.97-2H18v-.02c2.42-1.83 4-4.72 4-7.98 0-5.51-4.49-10-10-10M8.18 19.02C8.59 17.85 9.69 17 11 17h2c1.31 0 2.42.85 2.82 2.02-1.14.62-2.44.98-3.82.98s-2.69-.35-3.82-.98m9.3-1.21c-.81-1.66-2.51-2.82-4.48-2.82h-2c-1.97 0-3.66 1.16-4.48 2.82A7.96 7.96 0 0 1 4 11.99c0-4.41 3.59-8 8-8s8 3.59 8 8c0 2.29-.97 4.36-2.52 5.82">
            </path>
          </svg>
          <div class="oculto">Perfil</div>
        </a>
      </li>
      <li>
        <a id="logout" class="elemento"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="currentColor" viewBox="0 0 24 24">
            <path d="M9 13h7v-2H9V7l-6 5 6 5z"></path>
            <path d="M19 3h-7v2h7v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2"></path>
          </svg>
          <div class="oculto"> Cerrar Sesión</div>
        </a>
      </li>
    </ul>
  </nav>
  <div class="reservar">
    <form id="reservacontainer">
      <div class="campos">
        <div class="campos_sec">
          <h1 class="titu">Reservar Parqueadero</h1>
          <div class="formulario">
               <div class="espacios_reservas" id="espa_reser"></div>
            <svg xmlns="http://www.w3.org/2000/svg" class="icono_principal" width="24" height="24" fill="currentColor"
              viewBox="0 0 24 24">
              <path
                d="M12 2C6.58 2 2 6.58 2 12s4.58 10 10 10 10-4.58 10-10S17.42 2 12 2m0 18c-4.34 0-8-3.66-8-8s3.66-8 8-8 8 3.66 8 8-3.66 8-8 8">
              </path>
              <path d="M13 7h-2v6h6v-2h-4z"></path>
            </svg>
            <label for="horaEntrada">Hora de entrada</label>
            <input type="time" id="horaEntrada">
          </div>
          <div class="formulario">
            <svg xmlns="http://www.w3.org/2000/svg" class="icono_principal" width="24" height="24" fill="currentColor"
              viewBox="0 0 24 24">
              <path
                d="M12 2C6.58 2 2 6.58 2 12s4.58 10 10 10 10-4.58 10-10S17.42 2 12 2m0 18c-4.34 0-8-3.66-8-8s3.66-8 8-8 8 3.66 8 8-3.66 8-8 8">
              </path>
              <path d="M13 7h-2v6h6v-2h-4z"></path>
            </svg>
            <label for="horaSalida">Hora de salida</label>
            <input type="time" id="horaSalida">
          </div>
          <div class="formulario">
            <svg xmlns="http://www.w3.org/2000/svg" class="icono_principal" width="24" height="24" fill="currentColor"
              viewBox="0 0 24 24">
              <path
                d="M19 4h-2V2h-2v2H9V2H7v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2M5 20V8h14V6v14z">
              </path>
              <path d="M12 13h5v5h-5z"></path>
            </svg>
            <label for="fechaReserva">Fecha</label>
            <input type="date" id="fechaReserva">
          </div>
          <div>
            <p>Minutos: <span id="horas">0</span></p>
            <p>Total a pagar: <span id="precio">0</span> COP</p>
          </div>

          <button class="reserr" type="submit">Reservar</button>
        </div>
      </div>
      <div class="imagen">
        <img src="./asstes/reservar.png" alt="Ilustración de parqueadero">
      </div>
    </form>

  </div>

  <script type="module" src="./backend/reserva.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="./backend/logout.js"></script>
</body>


</html>
