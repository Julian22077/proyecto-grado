<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar información — Parqueadero CJ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="cuenta-page">
  <a href="perfil.html" class="volver" aria-label="Volver al perfil">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
      <path d="M9 12h12"/>
    </svg>
  </a>

  <main class="cuenta-edit">
    <form id="infoForm" class="actualizar_datos cuenta-form-card">
      <header class="cuenta-form-head">
        <p class="cuenta-kicker">Perfil</p>
        <h1 class="titu">Actualizar información</h1>
        <p class="cuenta-form-lead">Modifica tus datos personales. El correo no se cambia desde aquí.</p>
      </header>

      <div class="cuenta-field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" maxlength="50" minlength="3" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" placeholder="Nombre completo" required>
      </div>
      <div class="cuenta-field">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="Número de cédula" required>
      </div>
      <div class="cuenta-field">
        <label for="placa">Placa</label>
        <input type="text" id="placa" maxlength="6" placeholder="ABC123" required>
      </div>

      <button type="submit">Guardar cambios</button>
      <a class="cuenta-back-link" href="perfil.html">Cancelar y volver</a>
    </form>
  </main>

  <script type="module" src="./backend/actualizar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><span class="pantalla_carga_p">CJ</span></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Parqueadero CJ</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
