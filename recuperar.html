<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acceso — Parqueadero CJ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
  <div class="registro">
    <aside class="auth-brand imagen">
      <div class="auth-brand-copy auth-copy">
        <div class="auth-mark"><span>P</span> Parqueadero CJ</div>
        <h2>Restablecer acceso</h2>
        <p>Enviaremos un enlace de recuperación al correo asociado a su cuenta.</p>
      </div>
    </aside>
    <div class="campos">
      <div class="campos_sec">
        <h1 class="titu">Recuperar contraseña</h1>
        <p class="auth-lead">Indique el correo registrado en el sistema.</p>
        <form id="recuperar">
          <div class="formulario">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
          </div>
          <button type="submit" class="reserr">Enviar enlace</button>
        </form>
        <div class="auth-links">
          <p><a href="login.html">Volver al inicio de sesión</a></p>
        </div>
      </div>
    </div>
  </div>
  <form id="LoginForm" class="form-hidden" aria-hidden="true">
    <input type="email" name="correo">
    <input type="password" name="contraseña">
  </form>
  <script type="module" src="./backend/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><span class="pantalla_carga_p">CJ</span></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Parqueadero CJ</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
