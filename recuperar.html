<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="registro">
        <form id="recuperar">
            <div class="campos">
                <div class="campos_sec">
                    <h1 class="titu">Recuperar Contraseña</h1>
                    <p>Se te olvido la contraseña? ingresa tu correo</p>
                    <div class="formulario">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icono_principal" width="24" height="24"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 2v.51l-8 6.22-8-6.22V6zM4 18V9.04l7.39 5.74c.18.14.4.21.61.21s.43-.07.61-.21L20 9.03v8.96H4Z">
                            </path>
                        </svg>
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" placeholder="Correo" required>
                    </div>
                    <button type="submit" class="reserr">Enviar</button>
                </div>
            </div>
            <div class="imagen">
                <img src="./asstes/parkjc.png" alt="Ilustración de parqueadero">
            </div>
        </form>
    </div>
    <script type="module" src="./backend/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
